name: 原木商品出图

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: 抠图与商品套图合成
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify input photo exists
        run: |
          test -f input/product.jpg || (echo '请先上传 input/product.jpg 再运行' && exit 1)

      - name: Create real-product ecommerce images
        run: python generate.py --input input/product.jpg --output output

      - name: Upload generated images as ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wood-product-images
          path: output/
          if-no-files-found: error
          retention-days: 7
